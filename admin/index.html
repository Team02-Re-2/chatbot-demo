<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 화면 · 이관 대기열</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body class="inner">
<div class="site-bar"><div class="in"><b>팀2 · 상담사 이관 시연</b><span><a href="../">홈</a><a href="../chatbot1/">챗봇 1</a><a href="../chatbot2/">챗봇 2</a></span></div></div>
<header class="wrap" style="padding-top:24px">
  <h1>관리자 화면</h1>
  <p class="prose note">이 브라우저에서 한 시연 기록만 보여요. 서버에 저장하지 않아요.</p>
  <div id="clr"></div>
  <div class="counts" id="tiles"></div>
</header>
<main class="wrap">
  <div class="cols">
    <section><h2>이관 대기열</h2><div id="queue"></div></section>
    <section><h2>판정 기록</h2><div id="log"></div></section>
  </div>
</main>
<script>
(function(){
  var KEY="team2demo.v1", AKEY="team2demo.admin.v1", sel=null, asking=false;
  var LNAME={0:"정상·절차",1:"중립 문제 제기",2:"명시적 불만",3:"즉시 이관",9:"판단 불가"};
  var ENG={"v2":"팀 모델 v2","v2+규칙":"v2 + 규칙 안전장치","rule":"규칙","규칙":"규칙","절차":"판정 생략","claude":"Claude","모델":"모델"};
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
  function load(){ try{ var o=JSON.parse(localStorage.getItem(KEY)); if(o&&Array.isArray(o.sessions)) return o.sessions; }catch(e){} return []; }
  function loadA(){ try{ var o=JSON.parse(localStorage.getItem(AKEY)); if(o&&o.status&&typeof o.status==="object") return o; }catch(e){} return {status:{}}; }
  function saveA(a){ try{ localStorage.setItem(AKEY,JSON.stringify(a)); }catch(e){} }
  function hhmm(ms){ var d=new Date(Number(ms)||0); return isNaN(d)?"":d.toTimeString().slice(0,5); }
  function labText(t){ return (t.engine==="v2"&&t.label===0)?"0·1":String(t.label); }
  function badge(t){ var b=el("span","lab L"+(typeof t.label==="number"?t.label:"9"),labText(t)); b.title=LNAME[t.label]||""; return b; }
  var snapshot="", seen={}, first=true;
  function render(force){
    var ss=load(), A=loadA();
    var sig=JSON.stringify([ss,A,sel,asking]);
    if(!force&&sig===snapshot) return; snapshot=sig;
    var withTurns=ss.filter(function(s){return s.turns&&s.turns.length;});
    var imm=ss.filter(function(s){return s.handoff&&s.handoff.kind==="즉시";}).length;
    var cum=ss.filter(function(s){return s.handoff&&s.handoff.kind==="누적";}).length;
    var ask=ss.filter(function(s){return s.asking&&!s.handoff;}).length;
    var tiles=document.getElementById("tiles"); tiles.textContent="";
    [["전체 상담",withTurns.length],["즉시 이관",imm],["누적 이관",cum],["묻는 중",ask]].forEach(function(x){
      var t=el("div"); t.append(el("b",null,String(x[1])),el("span",null,x[0])); tiles.append(t); });
    /* 지우기 버튼 (2단계) */
    var c=document.getElementById("clr"); c.textContent="";
    if(!asking){ var b=el("button","btn sec","기록 지우기"); b.type="button"; b.onclick=function(){asking=true; render(true);}; c.append(b); }
    else { c.append(el("span","s","이 브라우저의 시연 기록을 모두 지울까요? "));
      var y=el("button","btn","네, 지웁니다"); y.type="button"; y.onclick=function(){ try{localStorage.removeItem(KEY); localStorage.removeItem(AKEY);}catch(e){} asking=false; sel=null; render(true); };
      var n=el("button","btn sec","취소"); n.type="button"; n.onclick=function(){asking=false; render(true);}; c.append(y,n); }
    /* 대기열 */
    var hs=ss.filter(function(s){return s.handoff;}).sort(function(a,b){return (b.handoff.at||0)-(a.handoff.at||0);});
    var q=document.getElementById("queue"); q.textContent="";
    if(!hs.length) q.append(el("div","empty","챗봇을 열어 대화하면 여기에 도착합니다"));
    hs.forEach(function(s){
      var h=s.handoff, st=A.status[s.id]||"대기";
      var card=el("div","ticket q "+(st==="완료"?"t-l0":h.kind==="즉시"?"t-l3":"t-l2")+(sel===s.id?" sel":"")+(seen[s.id]||first?"":" new")); seen[s.id]=1; card.onclick=function(){sel=s.id; render(true);};
      var top=el("div","tags"); top.append(el("span","tag",s.bot),el("span","tag",h.kind+" 이관"),el("span","tag",hhmm(h.at)),
        el("span","tag",st));
      var lt=s.turns&&s.turns.length?s.turns[s.turns.length-1]:null, he=h.engine||(lt&&lt.engine)||"";
      top.append(el("span","tag","엔진 "+(ENG[he]||he)));
      card.append(top,el("div",null,h.why||""));
      var dl=el("dl"); Object.keys(h.fields||{}).forEach(function(k){ dl.append(el("dt",null,k),el("dd",null,String(h.fields[k]))); }); card.append(dl);
      var row=el("div");
      var b1=el("button","btn sec","상담 시작"); b1.type="button"; b1.disabled=st!=="대기";
      b1.onclick=function(e){e.stopPropagation(); var a=loadA(); a.status[s.id]="상담중"; saveA(a); render(true);};
      var b2=el("button","btn sec","처리 완료"); b2.type="button"; b2.disabled=st==="완료";
      b2.onclick=function(e){e.stopPropagation(); var a=loadA(); a.status[s.id]="완료"; saveA(a); render(true);};
      row.append(b1,b2); card.append(row); q.append(card);
    });
    /* 판정 기록 */
    var cur=null; ss.forEach(function(s){ if(s.id===sel) cur=s; });
    if(!cur&&hs.length) cur=hs[0];
    if(!cur&&withTurns.length) cur=withTurns[withTurns.length-1];
    var lg=document.getElementById("log"); lg.textContent="";
    if(!cur){ lg.append(el("div","empty","챗봇을 열어 대화하면 여기에 도착합니다")); return; }
    lg.append(el("div","note",cur.bot+" · 시작 "+hhmm(cur.startedAt)+(cur.asking&&!cur.handoff?" · 연결 여부를 묻는 중":"")));
    var tw=el("div","tw"), tb=el("table"), thd=el("thead"), r0=el("tr");
    ["턴","고객 말","라벨","엔진","점수","사유"].forEach(function(h){r0.append(el("th",null,h));}); thd.append(r0); tb.append(thd);
    var body=el("tbody");
    (cur.turns||[]).forEach(function(t){ var r=el("tr");
      var lt=el("td"); lt.append(badge(t));
      r.append(el("td",null,String(t.n)),el("td",null,String(t.text)),lt,el("td",null,ENG[t.engine]||String(t.engine||"")),
        el("td",null,t.scores?"불만 "+Number(t.scores.complaint).toFixed(2)+" · 즉시 "+Number(t.scores.immediate).toFixed(2):"—"),el("td",null,String(t.reason||"")));
      body.append(r); });
    tb.append(body); tw.append(tb); lg.append(tw);
  }
  window.addEventListener("storage",function(e){ if(!e.key||e.key===KEY||e.key===AKEY) render(); });
  setInterval(render,2000);
  render(true); first=false;
})();
</script>
</body>
</html>
