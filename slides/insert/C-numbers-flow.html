y="430" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">기준선 비교</text><text x="548" y="454" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">0.3 · 0.5 · 0.7</text><text x="548" y="472" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">포착률과 연결 비율</text><rect x="784" y="384" width="208" height="104" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/><text x="796" y="406" fill="#2563eb" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">08</text><text x="796" y="430" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">0.7 채택</text><text x="796" y="454" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">포착 99.1% (72건 중 71건)</text><text x="796" y="472" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">표본 연결 23.5% → 8.3%</text><rect x="1032" y="384" width="208" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1044" y="406" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">09</text><text x="1044" y="430" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">전체에 적용</text><text x="1044" y="454" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">26,270대화 기준</text><text x="1044" y="472" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">연결 22.2% → 10.9%</text></g><text x="40" y="540" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">학습 줄(01~04)과 시험 줄(05~09)은 정답이 다릅니다. 02는 사람이 붙인 정답이고, 06~08은 AI(Claude Haiku)가 붙인 정답입니다.</text><text x="40" y="560" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">08은 표본 419개를 5,218대화에 맞게 보정한 추정값이고, 09는 전체 26,270대화에 그대로 적용한 값입니다. 두 연결 비율은 분모가 달라 섞지 않습니다.</text><text x="40" y="580" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">참고: 02의 사람 정답 60건으로 채점하면 즉시 이관 재현율은 0.3에서 86%, 0.7에서 71%입니다(별도 기준).</text><line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="40" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">범례</text><rect x="96" y="674" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="132" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">단계</text><rect x="196" y="674" width="24" height="12" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/><text x="232" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">팀이 고른 기준선</text><line x1
