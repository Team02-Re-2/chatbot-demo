    <h1>모델이 어떤 말에 반응했는지 봅니다</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="E-why-title E-why-desc"><title id="E-why-title">어절 제거로 본 판정 이유</title><desc id="E-why-desc">팀 모델 v2에서 어절을 하나씩 뺐을 때 불만 점수가 떨어진 폭과, 앞 대화를 비웠을 때 점수가 바뀐 예를 보여 주는 가로 막대그래프.</desc><defs></defs><rect width="1280" height="720" fill="#ffffff"/><text x="40" y="52" fill="#2563eb" font-size="12" font-weight="700" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">PART 4. 실전 적용 · 판정 이유</text><text x="40" y="92" fill="#2d3142" font-size="32" font-weight="700" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">모델이 어떤 말에 반응했는지 봅니다</text><line x1="40" y1="116" x2="1240" y2="116" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="40" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">예시 1 · 어제도 내일 온다더니 짜증나요</text><text x="40" y="212" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">어절 하나를 빼고 다시 채점했을 때 불만 점수가 떨어진 폭 (원래 0.94)</text><text x="240.0" y="548" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><line x1="320" y1="236" x2="320" y2="524" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="320.0" y="548" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.25</text><line x1="400" y1="236" x2="400" y2="524" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="400.0" y="548" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.5</text><line x1="480" y1="236" x2="480" y2="524" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="480.0" y="548" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.75</text><line x1="560" y1="236" x2="560" y2="524" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="560.0" y="548" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><line x1="240" y1="236" x2="240" y2="524" stroke="rgba(45,49,66,0.25)" stroke-width="1"/><rect x="240" y="252" width="179.2" height="40" fill="#ffffff"/><rect x="240" y="252" width="179.2" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="427.20000000000005" y="276" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">-0.56</text><text x="228" y="278" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">어제도</text><rect x="240" y="324" width="16.0" height="40" fill="#ffffff"/><rect x="240" y="324" width="16.0" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="264.0" y="348" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">-0.05</text><text x="228" y="350" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">내일</text><rect x="240" y="396" width="137.6" height="40" fill="#ffffff"/><rect x="240" y="396" width="137.6" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="385.6" y="420" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">-0.43</text><text x="228" y="422" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">온다더니</text><rect x="240" y="468" width="224.0" height="40" fill="#ffffff"/><rect x="240" y="468" width="224.0" height="40" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/><text x="472.0" y="492" fill="#2563eb" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">-0.70</text><text x="228" y="494" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">짜증나요</text><text x="680" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">예시 2 · 아 지금 조회해 보니 오늘 출발했다고 나오네요</text><text x="680" y="212" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">차분한 말인데 불만 점수가 높게 나온 경우. 앞 대화가 점수를 만들었습니다.</text><line x1="1104" y1="268" x2="1104" y2="412" stroke="rgba(45,49,66,0.55)" stroke-width="1" stroke-dasharray="4,3"/><rect x="1066" y="248" width="76" height="16" rx="2" fill="#ffffff"/><text x="1104.0" y="260" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">기준선 0.7</text><text x="880.0" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><line x1="1040" y1="268" x2="1040" y2="412" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="1040.0" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.5</text><line x1="1200" y1="268" x2="1200" y2="412" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/><text x="1200.0" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><line x1="880" y1="268" x2="880" y2="412" stroke="rgba(45,49,66,0.25)" stroke-width="1"/><rect x="880" y="284" width="300.8" height="40" fill="#ffffff"/><rect x="880" y="284" width="300.8" height="40" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/><text x="1188.8" y="308" fill="#2563eb" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.94</text><text x="868" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">앞 대화 포함</text><rect x="880" y="356" width="118.4" height="40" fill="#ffffff"/><rect x="880" y="356" width="118.4" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="1006.4" y="380" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.37</text><text x="868" y="382" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">앞 대화 비움</text><text x="680" y="488" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">어느 어절을 빼도 점수는 0.89~0.98로 거의 그대로였습니다.</text><text x="680" y="508" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">직전 발화의 불만("어제 온다던 택배가 안 와서 짜증나네요")이 번진 것으로 보입니다.</text><text x="40" y="612" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">팀 모델 v2(klue/roberta-base + 로지스틱 회귀) · 어절 제거법(occlusion) · 문맥: 챗봇 첫 인사말 + 앞 고객 발화 · 11/25 계산</text><line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="40" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">범례</text><rect x="96" y="674" width="24" height="12" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/><text x="132" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">가장 크게 반응한 부분</text><rect x="304" y="674" width="24" height="12" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="340" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">그 밖</text><line x1="412" y1="680" x2="436" y2="680" stroke="rgba(45,49,66,0.55)" stroke-width="1" stroke-dasharray="4,3"/><text x="448" y="684" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">불만 기준선 0.7</text></svg>
